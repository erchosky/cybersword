name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Compilación
        run: python -m compileall -q cybersword.py modules utils tests

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Análisis de seguridad (bandit)
        run: bandit -q -r cybersword.py modules utils -lll

      - name: Vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off
